[project]
name = "wkly-rp-qc-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tofu2220", email = "66412548+tofu2220@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
wkly-rp-qc-v2 = "wkly_rp_qc_v2:main"
wkly-rp-qc-web = "wkly_rp_qc_v2.web:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "playwright==1.64.0",
    "pytest==9.1.1",
    "pytest-playwright==0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
