<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weekly Report Quality Checker{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Weekly Report Quality Checker</a>
    <span class="local-badge">Local · {{ local_address | default("127.0.0.1") }}</span>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
